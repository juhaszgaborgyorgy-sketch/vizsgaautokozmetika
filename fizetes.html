<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajándékutalvány rendelése | Luxus Studios</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&family=Syne:wght@500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" href="logo.png">
    <script src="script.js" defer></script>
</head>
<body class="fizetes-test">
    <div class="hatter-sotetito"></div>
    <div class="fizetes-luxus-kontener">
        <div class="fizetes-osszegzes">
            <a href="autokozmetika.html" class="logo" style="margin-bottom: 30px; display: block;"><i class="fa-solid fa-gem"></i> LUXUS <span>STUDIOS</span></a>
            <h2 style="font-family: 'Syne', sans-serif; font-size: 1.8rem; color: #fff; margin-bottom: 25px;">Rendelés összegzése</h2>
            <div class="rendeles-tetel">
                <div class="tetel-ikon"><i class="fa-solid fa-gift"></i></div>
                <div class="tetel-adatok">
                    <h4 id="kiirtUtalvany">Luxus Ajándékutalvány</h4>
                    <p>Prémium szolgáltatásokra</p>
                </div>
            </div>
            <div class="elvalaszto-vonal"></div>
            <div class="osszesen-sor">
                <span>Utalvány értéke:</span>
                <strong id="kiirtOsszeg" class="arany-szoveg">50 000 Ft</strong>
            </div>
            <div class="biztonsagi-jelvenyek">
                <p><i class="fa-solid fa-gift"></i> Ajándékutalvány rendelése</p>
                <p><i class="fa-solid fa-hashtag"></i> Egyedi rendelési azonosító</p>
            </div>
        </div>

        <div class="fizetes-urlap-resz">
            <h3 style="font-family: 'Syne', sans-serif; font-size: 1.5rem; color: #fff; margin-bottom: 20px;">Megrendelés adatai</h3>
            <div class="rendeles-tetel" style="margin-bottom:20px;">
                <div class="tetel-ikon"><i class="fa-solid fa-user"></i></div>
                <div class="tetel-adatok"><h4>Megrendelő</h4><p id="rendeloEmail">—</p></div>
            </div>
            <form id="fizetesForm">
                <button type="submit" class="gomb gomb-elsodleges" style="width: 100%; margin-top: 15px; font-size: 1rem; padding: 16px;">
                    Megrendelés véglegesítése
                </button>
                <div style="text-align: center; margin-top: 20px;">
                    <a href="ajandekkartya.html" style="color: #a0a0a0; font-size: 0.85rem; transition: 0.3s;"><i class="fa-solid fa-arrow-left"></i> Vissza az utalványokhoz</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
